<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Top Strap -->
  <path d="M 330 40 L 470 40 L 460 260 L 340 260 Z" fill="url(#strapGrad)" rx="10"/>
  <rect x="350" y="80" width="100" height="12" rx="6" fill="#C2410C" opacity="0.6"/>
  <rect x="350" y="120" width="100" height="12" rx="6" fill="#C2410C" opacity="0.6"/>
  <rect x="350" y="160" width="100" height="12" rx="6" fill="#C2410C" opacity="0.6"/>
  <rect x="350" y="200" width="100" height="12" rx="6" fill="#C2410C" opacity="0.6"/>

  <!-- Bottom Strap -->
  <path d="M 340 540 L 460 540 L 470 760 L 330 760 Z" fill="url(#strapGrad)" rx="10"/>
  <rect x="350" y="580" width="100" height="12" rx="6" fill="#C2410C" opacity="0.6"/>
  <rect x="350" y="620" width="100" height="12" rx="6" fill="#C2410C" opacity="0.6"/>
  <rect x="350" y="660" width="100" height="12" rx="6" fill="#C2410C" opacity="0.6"/>
  <rect x="350" y="700" width="100" height="12" rx="6" fill="#C2410C" opacity="0.6"/>

  <!-- Watch Casing Shadow & Body -->
  <rect x="250" y="220" width="300" height="360" rx="72" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  
  <!-- Right Button / Crown -->
  <rect x="548" y="280" width="18" height="70" rx="6" fill="#EA580C"/>
  <circle cx="557" cy="315" r="4" fill="#FEF08A"/>
  <rect x="548" y="380" width="14" height="60" rx="4" fill="#64748B"/>

  <!-- Left Speaker Grille -->
  <rect x="238" y="340" width="14" height="80" rx="6" fill="#475569"/>
  <circle cx="245" cy="355" r="2" fill="#0F172A"/>
  <circle cx="245" cy="370" r="2" fill="#0F172A"/>
  <circle cx="245" cy="385" r="2" fill="#0F172A"/>
  <circle cx="245" cy="400" r="2" fill="#0F172A"/>

  <!-- Bezel -->
  <rect x="264" y="234" width="272" height="332" rx="58" fill="#1E293B"/>

  <!-- Screen AMOLED Display -->
  <rect x="274" y="244" width="252" height="312" rx="48" fill="url(#screenGrad)"/>

  <!-- Screen UI -->
  <!-- Top Status -->
  <text x="310" y="285" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">FRI 26 SEP</text>
  <circle cx="480" cy="280" r="5" fill="#10B981"/>
  <text x="440" y="285" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">98%</text>

  <!-- Giant Clock -->
  <text x="400" y="375" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" letter-spacing="-2">10:48</text>

  <!-- Health Metrics -->
  <g transform="translate(300, 420)">
    <!-- Heart Rate -->
    <circle cx="24" cy="24" r="20" fill="#EF4444" opacity="0.2"/>
    <path d="M 18 24 L 21 21 L 24 24 L 27 18 L 30 27 L 33 24" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="54" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">76</text>
    <text x="54" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">BPM</text>

    <!-- Steps -->
    <g transform="translate(110, 0)">
      <circle cx="24" cy="24" r="20" fill="#10B981" opacity="0.2"/>
      <path d="M 18 20 C 22 17, 28 22, 26 27 C 24 31, 18 31, 18 20 Z" fill="#10B981"/>
      <text x="54" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">8,450</text>
      <text x="54" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">STEPS</text>
    </g>
  </g>

  <!-- Activity Progress Ring / Card -->
  <rect x="296" y="480" width="208" height="52" rx="16" fill="#1E293B" opacity="0.9"/>
  <circle cx="326" cy="506" r="14" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="326" cy="506" r="14" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="60 30" stroke-linecap="round"/>
  <text x="350" y="502" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Bluetooth Call Active</text>
  <text x="350" y="518" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11">HD Voice Mic Ready</text>
</svg>
