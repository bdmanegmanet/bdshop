<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#94A3B8"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="chargerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg2)"/>

  <!-- Wireless Charger Disc on table -->
  <ellipse cx="400" cy="560" rx="220" ry="85" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="4"/>
  <ellipse cx="400" cy="556" rx="190" ry="70" fill="#F8FAFC"/>
  <ellipse cx="400" cy="554" rx="160" ry="55" fill="none" stroke="url(#chargerGlow)" stroke-width="6" opacity="0.75" filter="url(#glow)"/>
  <text x="400" y="560" text-anchor="middle" fill="#0284C7" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">FAST WIRELESS CHARGING</text>

  <!-- Watch floating angled back view showcasing sensors -->
  <g transform="translate(180, 160)">
    <!-- Midnight Black Strap Angled -->
    <path d="M 120 40 L 280 10 L 260 140 L 140 160 Z" fill="#0F172A" rx="8"/>
    <path d="M 160 300 L 280 280 L 300 440 L 180 470 Z" fill="#0F172A" rx="8"/>

    <!-- Titanium Base -->
    <rect x="80" y="120" width="280" height="200" rx="55" fill="url(#metal)" stroke="#94A3B8" stroke-width="3"/>

    <!-- Sensor Hub Ceramic Core -->
    <circle cx="220" cy="220" r="75" fill="#0F172A" stroke="#475569" stroke-width="4"/>
    <circle cx="220" cy="220" r="62" fill="#020617"/>

    <!-- Quad Optical Heart Rate & SpO2 LEDs Glowing -->
    <circle cx="200" cy="205" r="9" fill="#10B981" filter="url(#glow)"/>
    <circle cx="240" cy="205" r="9" fill="#10B981" filter="url(#glow)"/>
    <circle cx="200" cy="235" r="9" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="240" cy="235" r="9" fill="#EF4444" filter="url(#glow)"/>

    <circle cx="220" cy="220" r="4" fill="#FFFFFF"/>

    <!-- Spec labels -->
    <text x="220" y="160" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">TITANIUM ALLOY CASE</text>
    <text x="220" y="280" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" letter-spacing="0.5">BIOMETRIC SENSOR ARRAY</text>
  </g>

  <!-- Features Badge Pill -->
  <g transform="translate(240, 680)">
    <rect width="320" height="50" rx="25" fill="#0F172A"/>
    <circle cx="35" cy="25" r="12" fill="#10B981"/>
    <path d="M 30 25 L 34 29 L 40 21" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="60" y="31" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">ম্যাগনেটিক ফাস্ট চার্জার সহ</text>
  </g>
</svg>
